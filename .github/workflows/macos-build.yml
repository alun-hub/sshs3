name: macOS build (experimental)

# Builds an ad-hoc signed macOS package and keeps it as a workflow artifact. It never publishes a release: macOS is
# not a supported platform yet.
on:
  push:
    branches: [ feat/macos-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # node-pty 1.1.0 ships its prebuilt macOS spawn-helper without the executable bit, so spawning fails with
      # "posix_spawnp failed" until electron-builder rebuilds the module. The tests run before that.
      - name: Make node-pty's prebuilt spawn-helper executable
        run: chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      # Same versions as release.yml. age-plugin-yubikey v0.5.0 has no Intel binary for macOS, so only arm64 is built.
      - name: Prepare bundled age + age-plugin-yubikey for Team Vault
        run: |
          set -euo pipefail
          mkdir -p build-resources/age/mac

          curl -sSfL -o age.tar.gz "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-darwin-arm64.tar.gz"
          echo "e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5  age.tar.gz" | shasum -a 256 -c - # pragma: allowlist secret
          tar xzf age.tar.gz
          cp age/age age/age-keygen build-resources/age/mac/
          rm -rf age age.tar.gz

          curl -sSfL -o apy.tar.gz "https://github.com/str4d/age-plugin-yubikey/releases/download/v0.5.0/age-plugin-yubikey-v0.5.0-arm64-darwin.tar.gz"
          echo "5080607cbbbd75953f9d50a54ce07da72c38d663783bfcc1843cab5be4be5400  apy.tar.gz" | shasum -a 256 -c - # pragma: allowlist secret
          tar xzf apy.tar.gz
          cp age-plugin-yubikey/age-plugin-yubikey build-resources/age/mac/
          rm -rf age-plugin-yubikey apy.tar.gz

          chmod +x build-resources/age/mac/*

      # The checks below keep going after a failure, so one run shows everything that does not work yet.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run tests
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build and package
        id: package
        if: ${{ !cancelled() }}
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish never

      - name: Check the signature
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -euo pipefail
          app="release/mac-arm64/sshs3.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app"
          codesign --display --entitlements - "$app"
          # Expected to be rejected without notarization; printed to record what Gatekeeper says.
          spctl --assess --type execute --verbose=4 "$app" || true

      - name: Check native modules and bundled binaries
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -euo pipefail
          app="$PWD/release/mac-arm64/sshs3.app"
          cat > "$RUNNER_TEMP/check-native.cjs" <<'EOF'
          const path = require('node:path');
          const modules = path.join(process.argv[2], 'Contents/Resources/app.asar/node_modules');
          require(path.join(modules, 'pkcs11js'));
          console.log('pkcs11js loaded');
          const pty = require(path.join(modules, 'node-pty'));
          const child = pty.spawn('/bin/echo', ['node-pty works'], {});
          let output = '';
          child.onData((data) => { output += data; });
          child.onExit(({ exitCode }) => {
            console.log(output.trim());
            process.exit(exitCode === 0 && output.includes('node-pty works') ? 0 : 1);
          });
          setTimeout(() => { console.error('node-pty timed out'); process.exit(1); }, 15000);
          EOF
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/sshs3" "$RUNNER_TEMP/check-native.cjs" "$app"
          "$app/Contents/Resources/age/age" --version
          "$app/Contents/Resources/age/age-keygen" --version
          "$app/Contents/Resources/age/age-plugin-yubikey" --version

      # Real installations of the two common modules, to check the paths the app looks in and that the packaged app
      # (hardened runtime) can load them. No smartcard is present, so nothing is signed.
      - name: Check PKCS#11 module detection and loading
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -euo pipefail
          brew install opensc yubico-piv-tool
          SSHS3_PKCS11_REPORT="$RUNNER_TEMP/pkcs11.txt" npx vitest run tests/main/pkcs11Detection.mac.test.ts
          cat "$RUNNER_TEMP/pkcs11.txt"
          app="$PWD/release/mac-arm64/sshs3.app"
          cat > "$RUNNER_TEMP/check-pkcs11.cjs" <<'EOF'
          const path = require('node:path');
          const fs = require('node:fs');
          const [appDir, report] = process.argv.slice(2);
          const { PKCS11 } = require(path.join(appDir, 'Contents/Resources/app.asar/node_modules/pkcs11js'));
          for (const lib of fs.readFileSync(report, 'utf8').split('\n').filter(Boolean)) {
            const pkcs11 = new PKCS11();
            pkcs11.load(lib);
            pkcs11.C_Initialize();
            console.log(lib, '->', pkcs11.C_GetInfo().libraryDescription.trim(), '=', fs.realpathSync(lib));
            pkcs11.C_Finalize();
            pkcs11.close();
          }
          EOF
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/sshs3" "$RUNNER_TEMP/check-pkcs11.cjs" "$app" "$RUNNER_TEMP/pkcs11.txt"

      # The app's agent gets this allow-list (see agentProviderAllowlist.ts). No smartcard is present, so only the
      # agent's decision is checked: the OpenSC installation is let through, Homebrew's directory is not.
      - name: Check the ssh-agent PKCS#11 allow-list
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -euo pipefail
          allow="$(npx tsx -e "import { MAC_AGENT_PROVIDER_ALLOWLIST as list } from './src/main/ssh/agentProviderAllowlist'; process.stdout.write(list)")"
          echo "allow-list: $allow"
          # Homebrew's opensc formula stays out of the way of the cask, which is the installation the allow-list is for.
          brew unlink opensc
          brew install --cask opensc
          ssh -V
          sock="$RUNNER_TEMP/agent.sock"
          ssh-agent -d -P "$allow" -a "$sock" > "$RUNNER_TEMP/agent.log" 2>&1 &
          agent=$!
          printf '#!/bin/sh\necho 000000\n' > "$RUNNER_TEMP/askpass.sh"
          chmod 700 "$RUNNER_TEMP/askpass.sh"
          sleep 2
          for lib in /Library/OpenSC/lib/opensc-pkcs11.so /opt/homebrew/lib/libykcs11.dylib; do
            test -f "$lib"
            SSH_AUTH_SOCK="$sock" SSH_ASKPASS="$RUNNER_TEMP/askpass.sh" SSH_ASKPASS_REQUIRE=force ssh-add -s "$lib" < /dev/null || true
          done
          sleep 2
          kill "$agent" || true
          cat "$RUNNER_TEMP/agent.log"
          if grep -q 'refusing PKCS#11 add of "/Library/OpenSC' "$RUNNER_TEMP/agent.log"; then
            echo "::error::ssh-agent refused the OpenSC module"
            exit 1
          fi
          grep -q 'refusing PKCS#11 add of "/opt/homebrew' "$RUNNER_TEMP/agent.log"

      # Information only: a software token (SoftHSM) placed in the allowed directory shows whether macOS's own
      # ssh-agent can really load a third-party module and list its keys.
      - name: Try a software token through ssh-agent
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          allow="$(npx tsx -e "import { MAC_AGENT_PROVIDER_ALLOWLIST as list } from './src/main/ssh/agentProviderAllowlist'; process.stdout.write(list)")"
          brew install softhsm
          lib=/Library/OpenSC/lib/libsofthsm2.so
          sudo cp "$(brew --prefix softhsm)/lib/softhsm/libsofthsm2.so" "$lib"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm2.conf"
          mkdir -p "$RUNNER_TEMP/tokens"
          echo "directories.tokendir = $RUNNER_TEMP/tokens" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label ci --so-pin 123456 --pin 123456
          /Library/OpenSC/bin/pkcs11-tool --module "$lib" --login --pin 123456 --keypairgen --key-type rsa:2048 --label ci --id 01
          sock="$RUNNER_TEMP/agent-hsm.sock"
          ssh-agent -d -P "$allow" -a "$sock" > "$RUNNER_TEMP/agent-hsm.log" 2>&1 &
          agent=$!
          trap 'kill "$agent" || true; cat "$RUNNER_TEMP/agent-hsm.log"' EXIT
          printf '#!/bin/sh\necho 123456\n' > "$RUNNER_TEMP/askpass-hsm.sh"
          chmod 700 "$RUNNER_TEMP/askpass-hsm.sh"
          sleep 2
          SSH_AUTH_SOCK="$sock" SSH_ASKPASS="$RUNNER_TEMP/askpass-hsm.sh" SSH_ASKPASS_REQUIRE=force ssh-add -s "$lib" < /dev/null
          SSH_AUTH_SOCK="$sock" ssh-add -l

      - name: Smoke test the packaged app
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          SMOKE_APP_BIN: ${{ github.workspace }}/release/mac-arm64/sshs3.app/Contents/MacOS/sshs3
          SCREENSHOT_DIR: ${{ github.workspace }}/release/screenshots
          SMOKE_TIMEOUT_MS: '60000'
          VERBOSE: '1'
        run: npm run test:smoke

      - name: Upload package and screenshot
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: sshs3-macos-arm64
          path: |
            release/*.zip
            release/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
