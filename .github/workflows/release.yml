name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Windows
            os: windows-latest
            target: win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Run tests & typecheck
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Prepare bundled VcXsrv for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-resources/vcxsrv'
          Write-Host "Downloading VcXsrv 21.1.16.1 installer..."
          Invoke-WebRequest -Uri "https://github.com/marchaesen/vcxsrv/releases/download/21.1.16.1/vcxsrv-64.21.1.16.1.installer.exe" -OutFile "vcxsrv-installer.exe"
          Write-Host "Extracting VcXsrv with 7z..."
          7z x vcxsrv-installer.exe -o"build-resources/vcxsrv" -y
          if (Test-Path 'build-resources/vcxsrv/$PLUGINSDIR') {
            Remove-Item -Recurse -Force 'build-resources/vcxsrv/$PLUGINSDIR'
          }
          Remove-Item -Force "vcxsrv-installer.exe" -ErrorAction SilentlyContinue
          Write-Host "VcXsrv bundled successfully. Extracted files:"
          Get-ChildItem -Path 'build-resources/vcxsrv' | Select-Object -First 10 Name

      - name: Build application bundles
        run: |
          npm run build
          npx electron-builder --${{ matrix.platform.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List collected release files
        run: |
          echo "=== Release artifacts ==="
          ls -lh dist-artifacts

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-artifacts/*.AppImage
            dist-artifacts/*.deb
            dist-artifacts/*.rpm
            dist-artifacts/*.exe
            dist-artifacts/*.blockmap
            dist-artifacts/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
