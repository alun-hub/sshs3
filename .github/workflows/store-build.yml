name: Microsoft Store build

# Builds the MSIX/APPX package for the Microsoft Store. Manual only: the Store package is a separate
# channel from the GitHub release. The Store signs the package itself, so no code-signing certificate
# is used here.
# Optional submit job (input "submit"): uploads the package to Partner Center with the Microsoft Store
# Developer CLI. It runs in the "store" environment (holds the Partner Center credentials; configure
# required reviewers there). That environment allows only master, so a release is submitted by running this
# workflow from master with the input "tag": the build job then builds the code of that tag, while the submit
# job, which has the credentials, uses the changelog and the helper script of master. Submitting needs a tag,
# and the tagged commit has to be part of master (a tag can point anywhere), so that only released code of master
# can reach the Store:
#   gh workflow run store-build.yml --ref master -f tag=vX.Y.Z -f submit=true
# "commit" (default on) commits the submission: it goes to certification, and nothing has to be done by hand in Partner Center
# except "Publish now" when the submission holds publishing ("Don't publish until I select Publish now" under Submission
# options, which the draft that CI created in 2026-11 inherited). The texts (What's new etc.) are those of the last submission.
# Without "commit" (--noCommit) msstore creates the submission and uploads the package but never commits it, and Partner
# Center only processes and shows an uploaded package after the commit call (observed 2026-11-21: the draft still listed the old
# package; msstore source, IStorePackagedAPIExtensions.PublishAsync: 'Skipping submission commit'). There is no API mode for a
# draft to review in the browser, so "commit" off only makes sense for checking that the upload works.
# A submission that is in certification cannot be replaced: msstore deletes a pending submission before it creates a new one and
# that fails for one in certification, so run this when the previous submission is published.
# "patch" (default on) changes the submission before it is committed: the What's new text of every listing is the changelog
# entry of this version (scripts/store-submission.mjs), and an old uploaded package is marked for deletion (msstore only
# replaces a package with the same file extension, so the manually uploaded .appx would stay next to the new .msix). msstore has
# no command for this, so the submission is read with `submission get`, changed and sent back with `submission update`, then
# committed with `submission publish`. With "commit" off the run stops before the commit and prints the result (a dry run; the
# draft is deleted by the next run). Turn "patch" off to get the plain upload and commit.
# The step logs no raw msstore output beyond the publish itself: --verbose prints the upload URL with its signature (a SAS
# token that can write to the ingestion blob), and the logs of this public repository are readable by anyone.
# The bundled-tool steps (age, age-plugin-yubikey, VcXsrv) mirror release.yml (same pinned versions and
# checksums); update both files together.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z). Required to submit; empty builds the selected branch or tag
        type: string
        default: ''
      submit:
        description: Upload the package to Partner Center after building
        type: boolean
        default: false
      commit:
        description: Commit the submission (it goes to certification). Without it the uploaded package is NOT shown in Partner Center
        type: boolean
        default: true
      patch:
        description: Set What's new from CHANGELOG.md and remove the old package before the commit (off = plain upload and commit)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  store:
    name: Build Store package (Windows)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Spelled as a tag ref, so a branch can never be named here. Empty: the ref the run was started from.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          # The whole history and origin/master, for the check below.
          fetch-depth: 0

      # Keep this before every step that runs code from the checkout: that code is the tag's, the workflow is master's.
      - name: Check the release tag
        id: release
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($env:SUBMIT -eq 'true' -and -not $env:TAG) { throw "Submitting needs the release tag (-f tag=vX.Y.Z)" }
          if ($env:TAG -and $env:TAG -cne "v$version") { throw "Tag '$env:TAG' does not match the package.json version $version" }
          if ($env:TAG) {
            # Exit code 1: not part of master. Anything but 0 stops a submission.
            git merge-base --is-ancestor HEAD refs/remotes/origin/master
            $onMaster = $LASTEXITCODE -eq 0
            Write-Host "Tag $env:TAG is part of master: $onMaster"
            if ($env:SUBMIT -eq 'true' -and -not $onMaster) { throw "Tag '$env:TAG' is not part of master: only code released from master may be submitted" }
            $global:LASTEXITCODE = 0
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Start Windows OpenSSH Agent
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent

      - name: Install dependencies
        run: npm ci

      - name: Run tests & typecheck
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Prepare bundled age + age-plugin-yubikey for Team Vault
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-resources/age/win'

          Write-Host "Downloading age v1.3.2 (windows-amd64)..."
          Invoke-WebRequest -Uri "https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip" -OutFile "age.zip"
          $expectedAge = "f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7"
          $actualAge = (Get-FileHash -Algorithm SHA256 "age.zip").Hash.ToLower()
          if ($actualAge -ne $expectedAge) { throw "age.zip checksum mismatch: $actualAge" }
          Expand-Archive -Path "age.zip" -DestinationPath "age-extract" -Force
          Copy-Item "age-extract/age/age.exe" "build-resources/age/win/age.exe"
          Remove-Item -Recurse -Force "age-extract", "age.zip"

          Write-Host "Downloading age-plugin-yubikey v0.5.0 (x86_64-windows)..."
          Invoke-WebRequest -Uri "https://github.com/str4d/age-plugin-yubikey/releases/download/v0.5.0/age-plugin-yubikey-v0.5.0-x86_64-windows.zip" -OutFile "apy.zip"
          $expectedApy = "a2f1478bc691328861e9e511dfc498ddedb1d0b4b2e93c002f14ce1db0cb5abf"
          $actualApy = (Get-FileHash -Algorithm SHA256 "apy.zip").Hash.ToLower()
          if ($actualApy -ne $expectedApy) { throw "apy.zip checksum mismatch: $actualApy" }
          Expand-Archive -Path "apy.zip" -DestinationPath "apy-extract" -Force
          Copy-Item "apy-extract/age-plugin-yubikey/age-plugin-yubikey.exe" "build-resources/age/win/age-plugin-yubikey.exe"
          Remove-Item -Recurse -Force "apy-extract", "apy.zip"

      - name: Prepare bundled VcXsrv
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'build-resources/vcxsrv'
          Write-Host "Downloading VcXsrv 21.1.16.1 installer..."
          Invoke-WebRequest -Uri "https://github.com/marchaesen/vcxsrv/releases/download/21.1.16.1/vcxsrv-64.21.1.16.1.installer.exe" -OutFile "vcxsrv-installer.exe"
          # Pin the bundled third-party installer: fail the build if it changes upstream.
          $expected = "df7fed8f49665d0592528ab6be9d07111ea73c6848283d128b77690e05b8f90b"
          $actual = (Get-FileHash -Algorithm SHA256 "vcxsrv-installer.exe").Hash.ToLower()
          if ($actual -ne $expected) { throw "VcXsrv installer checksum mismatch: $actual" }
          7z x vcxsrv-installer.exe -o"build-resources/vcxsrv" -y
          if (Test-Path 'build-resources/vcxsrv/$PLUGINSDIR') {
            Remove-Item -Recurse -Force 'build-resources/vcxsrv/$PLUGINSDIR'
          }
          Remove-Item -Force "vcxsrv-installer.exe" -ErrorAction SilentlyContinue

      - name: Build Store package
        run: npm run package:store

      - name: Verify package manifest
        shell: pwsh
        run: |
          $appx = Get-ChildItem -Path release -Filter *.appx | Select-Object -First 1
          if (-not $appx) { throw "No .appx file found in release/" }
          Write-Host "Package: $($appx.Name)"
          Copy-Item $appx.FullName "store-package.zip"
          Expand-Archive -Path "store-package.zip" -DestinationPath "store-package" -Force
          $manifest = Get-Content -Raw "store-package/AppxManifest.xml"
          Write-Host $manifest

          $version = (node -p "require('./package.json').version").Trim()
          $checks = @(
            @{ Name = "Identity Name";   Pattern = 'Identity[^>]*\bName="alun\.sshs3"' },
            @{ Name = "Identity Publisher"; Pattern = 'Identity[^>]*Publisher="CN=DD4654AA-1C62-4E5D-AE38-CB3BE9A1F062"' },
            @{ Name = "Version $version.0"; Pattern = ('Identity[^>]*Version="' + [regex]::Escape($version) + '\.0"') },
            @{ Name = "runFullTrust capability"; Pattern = 'Capability\s+Name="runFullTrust"' },
            @{ Name = "PublisherDisplayName"; Pattern = '<PublisherDisplayName>alun</PublisherDisplayName>' }
          )
          $failed = $false
          foreach ($c in $checks) {
            if ($manifest -match $c.Pattern) { Write-Host "OK   $($c.Name)" }
            else { Write-Host "FAIL $($c.Name)"; $failed = $true }
          }
          # Partner Center refuses an .msix that targets Windows 10.0.17134.0 or older (electron-builder defaults to 10.0.14316.0).
          $min = [regex]::Match($manifest, 'TargetDeviceFamily[^>]*\bMinVersion="([^"]+)"').Groups[1].Value
          if ($min -and [version]$min -gt [version]'10.0.17134.0') { Write-Host "OK   MinVersion $min" }
          else { Write-Host "FAIL MinVersion '$min' (must be newer than 10.0.17134.0, see appx.minVersion in electron-builder.json)"; $failed = $true }
          if ($failed) { throw "AppxManifest.xml does not match the Partner Center identity" }

      - name: Upload Store package
        uses: actions/upload-artifact@v7
        with:
          name: store-package
          path: release/*.appx
          if-no-files-found: error
          retention-days: 14

  submit:
    name: Submit to Microsoft Store
    needs: store
    if: ${{ inputs.submit }}
    runs-on: windows-latest
    environment: store

    steps:
      # First: the checkout must not clean away the downloaded package. Only the changelog and the helper script are used.
      - name: Check out the changelog and the helper script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Store package
        uses: actions/download-artifact@v8
        with:
          name: store-package
          path: store-package

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure Microsoft Store Developer CLI
        shell: pwsh
        env:
          TENANT_ID: ${{ vars.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ vars.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }

      - name: Publish to Partner Center
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          COMMIT: ${{ inputs.commit }}
          PATCH: ${{ inputs.patch }}
        run: |
          $appx = Get-ChildItem -Path store-package -Filter *.appx | Select-Object -First 1
          if (-not $appx) { throw "No .appx file in the store-package artifact" }
          # Pointing msstore at a project directory makes it treat this as an Electron project (npm install,
          # own packaging). Pointing it at a .msix file selects the plain MSIX publisher, which uploads
          # exactly that file. An electron-builder .appx is the same package format, so give it .msix.
          $msix = Join-Path (Get-Location) ($appx.BaseName + '.msix')
          Copy-Item $appx.FullName $msix
          Write-Host "Submitting $($appx.Name) to product $env:PRODUCT_ID (commit=$env:COMMIT, patch=$env:PATCH)"
          $args = @('publish', $msix, '--appId', $env:PRODUCT_ID)
          # With patch on, the commit comes after the changes in the next steps.
          if ($env:PATCH -eq 'true' -or $env:COMMIT -ne 'true') { $args += '--noCommit' }
          msstore @args
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

      - name: Set What's new and remove the old package
        if: ${{ inputs.patch }}
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          # The version that was built, not the one of this job's checkout (master may have moved on).
          VERSION: ${{ needs.store.outputs.version }}
        run: |
          # msstore prints the JSON payload on stdout and everything meant for people on stderr (its default).
          $version = $env:VERSION
          node scripts/store-submission.mjs notes CHANGELOG.md $version release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw "No What's new text: CHANGELOG.md has no usable entry for $version" }
          $appx = Get-ChildItem -Path store-package -Filter *.appx | Select-Object -First 1
          $new = $appx.BaseName + '.msix'
          msstore submission get $env:PRODUCT_ID | Out-File -FilePath submission.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed" }
          node scripts/store-submission.mjs patch submission.json release-notes.txt $new patched.json
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare the submission update" }
          msstore submission update $env:PRODUCT_ID patched.json
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update failed" }

      - name: Commit the submission
        if: ${{ inputs.patch && inputs.commit }}
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          msstore submission publish $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed" }

      # Best effort: only a few fields are printed (the raw submission JSON contains the upload URL with its signature).
      - name: Show the submission state
        continue-on-error: true
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $raw = (msstore submission get $env:PRODUCT_ID 2>&1 | Out-String)
          $start = $raw.IndexOf('{')
          if ($start -lt 0) { Write-Host "No submission data in the output."; return }
          try { $s = $raw.Substring($start) | ConvertFrom-Json } catch { Write-Host "Could not read the submission data."; return }
          Write-Host "id: $($s.id)  status: $($s.status)  targetPublishMode: $($s.targetPublishMode)"
          foreach ($p in $s.applicationPackages) { Write-Host "package: $($p.fileName)  $($p.fileStatus)  version: $($p.version)" }
          foreach ($l in $s.listings.PSObject.Properties) { Write-Host "listing $($l.Name): release notes $($l.Value.baseListing.releaseNotes.Length) characters" }
