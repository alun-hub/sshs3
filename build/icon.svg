<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Top bar dots -->
  <circle cx="80" cy="80" r="14" fill="#ef4444"/>
  <circle cx="120" cy="80" r="14" fill="#f59e0b"/>
  <circle cx="160" cy="80" r="14" fill="#10b981"/>

  <!-- Terminal window inner container -->
  <rect x="52" y="128" width="408" height="320" rx="32" fill="#020617" stroke="#1e293b" stroke-width="4"/>

  <!-- SSH Prompt ">" symbol -->
  <path d="M 100 180 L 190 250 L 100 320" fill="none" stroke="url(#glowGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Terminal cursor "_" -->
  <rect x="220" y="304" width="70" height="24" rx="8" fill="#38bdf8" filter="url(#glow)"/>

  <!-- S3 / Cloud accent in top right of inner terminal -->
  <path d="M 360 210 A 30 30 0 0 0 310 195 A 40 40 0 0 0 250 220 A 25 25 0 0 0 255 260 L 365 260 A 25 25 0 0 0 360 210 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small lock / key hole accent -->
  <circle cx="310" cy="235" r="8" fill="#fbbf24"/>
</svg>
